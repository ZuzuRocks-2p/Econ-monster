<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a14">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Escape from the Econ Monster</title>
<link rel="manifest" href="manifest.json">
<link rel="preload" as="image" href="art/sprites/lad_idle.png">
<link rel="preload" as="image" href="art/sprites/lass_idle.png">
<link rel="preload" as="image" href="art/sprites/scottie_idle.png">
<link rel="preload" as="image" href="art/ui/frame.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: phone-first boss-fight screen. Pixel-art canvas scene on top, HUD, question card below. Single dark arcade theme by choice. */
:root{
  --bg:#0b0a14; --panel:#161327; --panel2:#221c3a; --line:#3b3160; --lineHi:#6a58a8;
  --fg:#f1e9d2; --muted:#9f97b8; --accent:#ffb347; --accentDk:#9a5f12;
  --tome:#7bdc5a; --hurt:#ff5c5c; --good:#7bdc5a;
  --pixel:'Press Start 2P','Courier New',monospace;
  --body:'Nunito','Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  background-image:radial-gradient(ellipse at 50% -10%,#2a1a4a 0%,var(--bg) 60%);background-attachment:fixed}
body.flash{animation:flash .4s}
@keyframes flash{0%{background-color:#5a1f1f}100%{background-color:var(--bg)}}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--pixel);font-size:1.25rem;line-height:1.5;margin:0;color:var(--accent);text-shadow:3px 3px 0 #000,0 0 18px #ffb34766;text-wrap:balance}
h1.victory{color:var(--tome);text-shadow:3px 3px 0 #000,0 0 18px #7bdc5a88}
h1.lose{color:var(--hurt);text-shadow:3px 3px 0 #000,0 0 18px #ff5c5c88}
.title{text-align:center;padding-top:6px;display:flex;flex-direction:column;gap:8px}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.85rem}
.eyebrow{font-family:var(--pixel);font-size:.55rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);line-height:1.6}
.scene{position:relative;width:100%;aspect-ratio:360/200;max-width:100%;border:3px solid var(--line);border-radius:6px;overflow:hidden;background:#0b0a1e;box-shadow:0 0 0 3px #000,0 10px 30px #000a;image-rendering:pixelated}
.scene canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 2px,transparent 2px 4px);mix-blend-mode:multiply}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 40px #000c}
#fx{position:absolute;inset:0;pointer-events:none}
.dmgpop{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--pixel);font-size:1.5rem;color:var(--accent);text-shadow:3px 3px 0 #000;animation:pop .9s forwards}
.dmgpop.heal{color:var(--tome)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}20%{opacity:1;transform:translate(-50%,0) scale(1.25)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.hud{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hpnum{font-family:var(--pixel);font-size:.9rem;color:var(--tome);margin-left:auto}
.hpbar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;background:#000;border:3px solid var(--line);padding:3px;border-radius:4px}
.hpbar i{display:block;height:16px;background:#1b1830;transition:background .2s}
.hpbar i.on{background:var(--tome);box-shadow:inset 0 -5px 0 #3f8f2c}
.hpbar i.on.low{background:var(--hurt);box-shadow:inset 0 -5px 0 #8f2c2c}
.hearts{display:flex;gap:5px}
.heart{width:18px;height:16px;background:var(--hurt);clip-path:polygon(50% 100%,0 40%,0 15%,15% 0,35% 0,50% 15%,65% 0,85% 0,100% 15%,100% 40%);filter:drop-shadow(1px 1px 0 #000)}
.heart.off{background:#2a2440}
.timer{font-family:var(--pixel);font-size:1rem;font-variant-numeric:tabular-nums;color:var(--accent);min-width:2.2ch;text-align:right}
.timer.low{color:var(--hurt);animation:blink .5s infinite}
@keyframes blink{50%{opacity:.3}}
.taunt{font-style:italic;color:#d8ffcd;background:#14241a;border:2px solid #2c4f2a;border-left:5px solid var(--tome);padding:9px 12px;border-radius:4px;font-size:.95rem;font-weight:700}
.taunt.cast{color:#ffd9d9;background:#2a1414;border-color:#5a2222;border-left-color:var(--hurt)}
.taunt b{font-family:var(--pixel);font-size:.65rem;font-style:normal}
.card{background:var(--panel);border:3px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 0 3px #000}
.q{font-size:1.15rem;font-weight:900;line-height:1.35}
button{font-family:var(--body);font-weight:900;font-size:1rem;border:3px solid #000;border-radius:6px;padding:12px 14px;cursor:pointer;color:#1a1408;background:var(--accent);box-shadow:0 5px 0 var(--accentDk),0 5px 0 3px #000;transition:transform .06s,box-shadow .06s;width:100%;text-align:left;display:flex;flex-direction:column;gap:3px}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accentDk),0 1px 0 3px #000}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button .lbl{font-family:var(--pixel);font-size:.75rem;line-height:1.4}
button .sub{font-size:.85rem;font-weight:700;opacity:.85}
button.ghost{background:var(--panel2);color:var(--fg);box-shadow:0 5px 0 #0b0a14,0 5px 0 3px #000}
button.ghost:active{box-shadow:0 1px 0 #0b0a14,0 1px 0 3px #000}
button.center{align-items:center;text-align:center}
.opts{display:flex;flex-direction:column;gap:10px}
button.opt{background:var(--panel2);color:var(--fg);box-shadow:0 5px 0 #0b0a14,0 5px 0 3px #000;flex-direction:row;align-items:center;gap:12px}
button.opt .key{font-family:var(--pixel);color:var(--accent);font-size:.9rem;min-width:1.4em}
button.opt.right{background:#2d5a24;color:#e8ffd9;border-color:var(--tome)}
button.opt.wrong{background:#6a2626;color:#ffd9d9;border-color:var(--hurt)}
button:disabled{cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two button{justify-content:center;text-align:center;font-size:1rem;min-height:72px}
input[type=text],input[type=number]{width:100%;font:inherit;font-size:1.3rem;font-weight:900;padding:12px;border-radius:4px;border:3px solid var(--line);background:#000;color:var(--fg)}
input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
input.good{border-color:var(--good)}input.bad{border-color:var(--hurt)}
.why{background:var(--panel2);border-radius:4px;padding:10px 12px;font-size:.95rem;border-left:5px solid var(--accent)}
.why.ok{border-left-color:var(--good)}.why.bad{border-left-color:var(--hurt)}
.src{font-size:.7rem;color:var(--muted);margin-top:6px;font-family:var(--pixel);font-size:.5rem}
.why b{font-family:var(--pixel);font-size:.6rem;color:var(--accent)}
.why.ok b{color:var(--good)}.why.bad b{color:var(--hurt)}
.share{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem;background:#000;border:3px dashed var(--line);border-radius:4px;padding:12px;white-space:pre-wrap;word-break:break-word}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats>div{background:var(--panel);border:3px solid var(--line);border-radius:6px;padding:10px 4px;display:flex;flex-direction:column;gap:6px}
.stats .n{font-family:var(--pixel);font-size:1.1rem;color:var(--accent);line-height:1}
.stats .n.rk{font-size:.55rem;line-height:1.4;color:var(--tome)}
.stats .l{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:900}
.rankrow{background:var(--panel);border:3px solid var(--line);border-radius:6px;padding:10px 14px}
.rank{font-family:var(--pixel);font-size:.8rem;color:var(--tome)}
.field{display:flex;flex-direction:column;gap:6px}
.miss{padding:4px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:#1a1408;font-family:var(--pixel);font-size:.7rem;padding:12px 16px;border:3px solid #000;border-radius:4px;box-shadow:0 4px 0 #000;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.footer{text-align:center;font-size:.75rem;color:var(--muted);padding-bottom:8px}

.mute{position:absolute;right:6px;top:6px;width:auto;padding:4px 8px;font-size:1rem;background:#000a;color:#fff;border:2px solid var(--line);box-shadow:none;border-radius:4px}
.mute:active{transform:none}
.combo{font-family:var(--pixel);font-size:.6rem;color:var(--muted)}
.combo.hot{color:var(--accent);animation:blink .4s infinite}
.dmgpop.crit{color:#fff;font-size:1.3rem;text-shadow:3px 3px 0 #000,0 0 20px var(--accent)}
.dmgpop.broke{color:var(--hurt);font-size:.9rem;top:55%}
.hpbar.wide i{height:22px}
.loot{background:#2a2410;border:3px solid var(--accent);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 0 18px #ffb34755}
.loot p{font-weight:900}
.ptitle{text-align:center;font-weight:900;color:var(--accent)}
.a2hs{border-color:var(--green,#4ba65a)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:1.25rem;letter-spacing:.08em;text-align:center;background:#0b1430;border:2px solid var(--gold,#f0d060);border-radius:6px;padding:10px;user-select:all;-webkit-user-select:all;word-break:break-all}
.ptitle em{color:var(--fg);font-style:italic;font-weight:700}
.rrow{display:grid;grid-template-columns:2ch 1fr auto;gap:10px;padding:8px 6px;border-bottom:2px solid var(--line);align-items:center}
.rrow.me{background:#2a2410}
.rrow .pos{font-family:var(--pixel);font-size:.6rem;color:var(--accent)}
.rrow .rn{font-weight:900}
.rrow .rd{font-family:var(--pixel);font-size:.7rem;color:var(--tome);font-variant-numeric:tabular-nums}
.scene.map{aspect-ratio:360/300}
.locs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.loc{background:var(--panel);border:3px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center}
.loc.free{border-color:var(--tome)}
.loc .lk{grid-row:1/3;font-size:1.2rem}
.loc .ln{font-weight:900}
.loc .lb{font-size:.7rem;color:var(--muted)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs .n{font-family:var(--pixel);font-size:1.2rem;color:var(--accent)}
.vs .l{font-size:.75rem;color:var(--muted);font-weight:900}
.vsx{font-family:var(--pixel);font-size:.8rem;color:var(--tome)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{width:auto;padding:8px 12px;font-size:.85rem;background:var(--panel2);color:var(--fg);box-shadow:0 3px 0 #000;border-radius:999px}
.chip.on{background:var(--accent);color:#1a1408}
button.item{border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.dmgpop,.timer.low,body.flash{animation:none}}

/* 90s JRPG skin */
:root{--bg:#0a0a2a;--panel:#10184a;--panel2:#1a2466;--line:#f1e9d2;--lineHi:#8aa0ff;--fg:#f1e9d2;--muted:#aab4e0;--accent:#ffd36b;--accentDk:#a8781a}
body{background:#0a0a2a;background-image:linear-gradient(180deg,#0a0a2a 0%,#141a5a 100%)}
.card,.stats>div,.rankrow,.loc,.win,.loot{background:linear-gradient(180deg,#1a2466,#10184a);border:3px solid var(--line);border-radius:8px;box-shadow:0 0 0 2px #0a0a2a,0 0 0 4px #8aa0ff,0 6px 0 4px #0a0a2a}
.win{padding:12px}
.taunt{background:#10184a;border:3px solid var(--line);border-left-width:3px;border-radius:8px;box-shadow:0 0 0 2px #0a0a2a,0 0 0 4px #8aa0ff;color:#f1e9d2;font-style:normal;font-weight:700}
.taunt.cast{background:#3a1030;border-color:#ffb3c6;color:#ffe0ea}
button{border:3px solid #0a0a2a;border-radius:6px}
button.ghost,button.opt{background:linear-gradient(180deg,#1a2466,#10184a);color:var(--fg);border:3px solid var(--line);box-shadow:0 0 0 2px #0a0a2a,0 4px 0 2px #0a0a2a}
button.ghost:active,button.opt:active{box-shadow:0 0 0 2px #0a0a2a,0 1px 0 2px #0a0a2a}
button.opt .key{color:var(--accent)}
button.big{background:linear-gradient(180deg,#ffe08a,#ffb347);box-shadow:0 0 0 2px #0a0a2a,0 4px 0 2px #0a0a2a}
button.big:active{box-shadow:0 0 0 2px #0a0a2a,0 1px 0 2px #0a0a2a}
.hpbar{background:#0a0a2a;border:3px solid var(--line)}
.hpbar i{background:#1a2466}
.hpbar i.on{background:#7bdc5a;box-shadow:inset 0 -5px 0 #3f8f2c}
.scene{border:3px solid var(--line);box-shadow:0 0 0 2px #0a0a2a,0 0 0 4px #8aa0ff,0 10px 30px #000a}
.scene.map{aspect-ratio:256/224}
h1{color:#ffd36b;text-shadow:3px 3px 0 #0a0a2a,0 0 14px #ffd36b66}
.eyebrow{color:#aab4e0}
.rrow.me{background:#2a3480}
.loc{display:grid}
.locs{gap:8px}

/* Highland Scots theme: royal blue #2d4f9d, kelly green #4ba65a, tartan */
:root{--bg:#0d1a3a;--panel:#1a3270;--panel2:#2d4f9d;--line:#f1e9d2;--lineHi:#4ba65a;--fg:#f4f1e6;--muted:#b9c6e8;--accent:#ffd36b;--accentDk:#a8781a;--tome:#4ba65a;--good:#4ba65a;--green:#4ba65a;--blue:#2d4f9d}
body{background:#0d1a3a;background-image:
  repeating-linear-gradient(0deg,transparent 0 22px,rgba(75,166,90,.10) 22px 26px,transparent 26px 48px,rgba(255,211,107,.06) 48px 50px),
  repeating-linear-gradient(90deg,transparent 0 22px,rgba(75,166,90,.10) 22px 26px,transparent 26px 48px,rgba(255,211,107,.06) 48px 50px),
  linear-gradient(180deg,#0d1a3a,#132a5c)}
.card,.stats>div,.rankrow,.loc,.win,.loot{background:linear-gradient(180deg,#2d4f9d,#1a3270);border:3px solid var(--line);box-shadow:0 0 0 2px #0d1a3a,0 0 0 4px var(--green),0 6px 0 4px #0d1a3a}
.taunt{background:#1a3270;border-color:var(--line);box-shadow:0 0 0 2px #0d1a3a,0 0 0 4px var(--green)}
.taunt.cast{background:#4a1030;border-color:#ffb3c6;box-shadow:0 0 0 2px #0d1a3a,0 0 0 4px #ff5c5c}
button.ghost,button.opt{background:linear-gradient(180deg,#2d4f9d,#1a3270);border-color:var(--line);box-shadow:0 0 0 2px #0d1a3a,0 4px 0 2px #0d1a3a}
button.opt.right{background:#2f7a3c;border-color:#b8ff9c}
button.big{background:linear-gradient(180deg,#6fd080,#4ba65a);color:#0d1a3a;box-shadow:0 0 0 2px #0d1a3a,0 4px 0 2px #0d1a3a}
button.big:active{box-shadow:0 0 0 2px #0d1a3a,0 1px 0 2px #0d1a3a}
.hpbar{background:#0d1a3a}
.hpbar i{background:#1a3270}
.hpbar i.on{background:#4ba65a;box-shadow:inset 0 -5px 0 #2f7a3c}
.scene{box-shadow:0 0 0 2px #0d1a3a,0 0 0 4px var(--green),0 10px 30px #000a}
h1{color:#ffd36b;text-shadow:3px 3px 0 #0d1a3a,0 0 14px #4ba65a66}
.eyebrow{color:#9fd8aa}
.rrow.me{background:#2f7a3c}
.loc.free{border-color:#b8ff9c}
.rank,.stats .n.rk,.rrow .rd{color:#9fd8aa}
.tartan{height:10px;background:
  repeating-linear-gradient(90deg,#2d4f9d 0 8px,#4ba65a 8px 12px,#2d4f9d 12px 20px,#ffd36b 20px 22px),
  #2d4f9d;border-top:2px solid #0d1a3a;border-bottom:2px solid #0d1a3a;margin:-4px 0 2px}
.card.story p{font-size:1.05rem;line-height:1.55}
.card.story b{color:var(--accent)}
button:disabled.ghost{opacity:.5}

.mapHud{position:absolute;left:8px;top:8px;pointer-events:none}
.bossIntro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,26,58,.55);animation:bossIn 2.2s forwards;pointer-events:none}
.bossIntro span{font-family:var(--pixel);font-size:1.1rem;color:#ff5c5c;text-shadow:3px 3px 0 #000;letter-spacing:.05em;text-align:center;padding:0 10px}
.bossIntro small{font-family:var(--pixel);font-size:.55rem;color:#fff;margin-top:8px}
@keyframes bossIn{0%{opacity:0;transform:scale(1.3)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
button.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
.scene.map{cursor:pointer}
@media (prefers-reduced-motion:reduce){button.pulse,.bossIntro{animation:none}}

button.opt.dim{opacity:.45}
.shakeX{animation:shakeX .4s}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
button.opt.right{animation:popIn .3s}
@keyframes popIn{0%{transform:scale(.97)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.sndHint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-family:var(--pixel);font-size:.5rem;color:#fff;background:rgba(13,26,58,.8);border:2px solid var(--line);padding:6px 10px;border-radius:4px;animation:blink 1.4s infinite;pointer-events:none;white-space:nowrap}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.heroBtn{align-items:center;text-align:center;gap:8px;padding:12px 6px}
.heroBtn canvas{image-rendering:pixelated;width:100%;height:auto;aspect-ratio:3/2}
.heroBtn.on{border-color:#ffd36b;box-shadow:0 0 0 2px #0d1a3a,0 0 0 4px #ffd36b,0 4px 0 2px #0d1a3a}
.review{padding-left:20px;display:flex;flex-direction:column;gap:10px;margin:0}
.review li{line-height:1.35}
.srow{display:grid;grid-template-columns:1fr 90px 64px;gap:8px;align-items:center;padding:4px 0}
.srow .sn{font-size:.85rem;font-weight:900}
.sbar{height:12px;background:#0d1a3a;border:2px solid var(--line);border-radius:3px;overflow:hidden}
.sbar i{display:block;height:100%;background:#4ba65a}
.sbar i.low{background:#ff5c5c}
.srow .sv{font-family:var(--pixel);font-size:.6rem;text-align:right;color:var(--accent)}
.srow .sv small{color:var(--muted);font-size:.45rem}

/* 16-bit UI kit */
.card,.win,.loot,.rankrow,.stats>div,.taunt{border:14px solid transparent;border-image:url("art/ui/frame.png") 70 fill / 14px stretch;background:none;box-shadow:0 6px 0 #0d1a3a;border-radius:0}
.taunt{border-width:12px;border-image-width:12px}
.taunt.cast{filter:none;color:#ffd9d9;position:relative}
.taunt.cast::after{content:"";position:absolute;inset:-12px;background:rgba(255,60,60,.14);pointer-events:none}
.stats>div{border-width:10px;border-image-width:10px;padding:6px 2px}
.tartan{height:34px;background:url("art/ui/banner.png") center/contain no-repeat;border:0;margin:0}
.heart{width:26px;height:24px;background:url("art/ui/heart0.png") center/contain no-repeat;clip-path:none;filter:none}
.heart.off{background-image:url("art/ui/heart2.png")}
.hpwrap{position:relative;height:34px;background:url("art/ui/hpbar.png") center/100% 100% no-repeat}
.hpwrap .hpbar{position:absolute;left:9%;right:5%;top:30%;bottom:30%;border:0;background:none;padding:0;gap:2px}
.hpwrap .hpbar i{height:100%}
.titleCard{width:100%;aspect-ratio:1200/670;background:url("art/ui/title.jpg") center/cover no-repeat;border:0;border-radius:6px;box-shadow:0 8px 24px #000a}
.scene{border:10px solid transparent;border-image:url("art/ui/frame.png") 70 / 10px stretch;box-shadow:0 8px 24px #000a;border-radius:0}
.scene.map{aspect-ratio:256/224}
.icon{image-rendering:pixelated;width:48px;height:48px;object-fit:contain;vertical-align:middle}
.icon.sm{width:28px;height:28px}
.icon.chest{width:64px;height:64px;flex:0 0 64px}
.lootrow{flex-direction:row;align-items:center;gap:12px}
.itemrow{display:flex;gap:12px;align-items:center;padding:6px 0}
button.item{flex-direction:row;gap:8px;justify-content:center}
.tut{position:fixed;inset:0;background:rgba(13,26,58,.85);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.tutcard{max-width:420px;width:100%;gap:14px}
.tutcard h2{font-family:var(--pixel);font-size:.9rem;color:var(--accent);margin:0;line-height:1.5}
.tutcard p{font-size:1.05rem;line-height:1.5}
.tutcard p b{color:var(--accent)}
button.ghost.small .lbl{font-size:.6rem}
.fxs{position:absolute;transform:translate(-50%,-50%);image-rendering:pixelated;pointer-events:none;animation:fxpop .6s ease-out forwards}
@keyframes fxpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
button.opt::before,button.opt::after{content:none!important;display:none!important}
</style>
